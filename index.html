<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Know Your Ward</title>
<meta name="description" content="Explore your BBMP ward — amenities, coverage, and your corporator, in one place.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://basemaps.cartocdn.com">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">

<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/components.css">
<link rel="stylesheet" href="src/styles/transition.css">
</head>
<body>

<div id="loadingIndicator" class="loading-indicator">
  <div class="loading-spinner" aria-label="Loading ward data"></div>
</div>

<div class="topcluster">
  <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</div>

<a href="#methodology" id="methodologyLink" class="methodology-link">Methodology</a>

<main>
  <section id="view-home" class="view">
    <div class="container" id="homeContainer"></div>
  </section>

  <section id="view-find" class="view">
    <div class="container" id="findContainer"></div>
  </section>

  <section id="view-ward" class="view">
    <div class="container" id="wardContainer"></div>
  </section>

  <section id="view-methodology" class="view">
    <div class="container" id="methodologyContainer"></div>
  </section>
</main>

<script defer src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script defer src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script type="module" src="src/js/main.js"></script>
</body>
</html>
